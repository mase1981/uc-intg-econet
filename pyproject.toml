[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-intg-econet"
description = "Rheem EcoNet integration for Unfolded Circle Remote Two/3"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
version = "1.0.0"
authors = [
    {name = "Meir Miyara", email = "meir.miyara@gmail.com"}
]
keywords = ["rheem", "econet", "water-heater", "thermostat", "climate", "unfolded-circle", "remote", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "ucapi>=0.7.0",
    "ucapi-framework>=1.9.5",
    "aiohttp>=3.9.0",
    "pyeconet>=0.2.6",
]

[project.urls]
"Homepage" = "https://github.com/mase1981/uc-intg-econet"
"Bug Reports" = "https://github.com/mase1981/uc-intg-econet/issues"
"Source" = "https://github.com/mase1981/uc-intg-econet"

[project.scripts]
uc-intg-econet = "uc_intg_econet:main"

[tool.setuptools.packages.find]
include = ["uc_intg_econet*"]

[tool.setuptools.package-data]
uc_intg_econet = ["*.json"]
